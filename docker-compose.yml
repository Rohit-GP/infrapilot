services:
  redis:
    image: redis:7-alpine
    container_name: agentic-noc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # postgres, spring-boot, and the langgraph service get added here
  # in Phases 3-5 as they're built.

volumes:
  redis-data:
